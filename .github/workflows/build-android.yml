
name: Build My Workout Planner Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'build-android.yml'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icon.svg'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get app source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare app files
        run: |
          mkdir -p www
          tar --exclude=.git --exclude=.github --exclude=node_modules --exclude=android --exclude=www -cf - . | tar -xf - -C www
          test -f www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "My Workout Planner" com.myworkoutplanner.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Workout-Planner-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
